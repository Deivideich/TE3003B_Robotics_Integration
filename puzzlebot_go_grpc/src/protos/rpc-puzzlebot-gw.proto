//author AECL

syntax = "proto3";
import "google/protobuf/empty.proto";

package RPCPuzzlebotPKG;

option go_package = "dreamteam.com/puzzlebot-grpc/protos";
import "google/api/annotations.proto";

service PuzzlebotRPC {
    rpc GetTrailersData (google.protobuf.Empty) returns (TrailersArray){
        option(google.api.http) = {
            post: "/gettrailersdata"
            body: "*"
        };
    };
    rpc GetImage (google.protobuf.Empty) returns (CompressedImage){        
        option(google.api.http) = {
            post: "/getimage"
            body: "*"
        };
    };
    rpc GetAudio (Audio) returns (google.protobuf.Empty){
        option(google.api.http) = {
            post: "/getaudio"
            body: "*"
        };
    };
}

message TrailersArray {
    repeated int32 ids = 1 [packed=true]; 
    repeated int32 boxes = 2 [packed=true]; 
}

message CompressedImage {
    bytes img = 1;
}

message Audio {
    bytes audio = 1;
}